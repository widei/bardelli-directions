<title>Acrylic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&display=swap">

<style>
/* ============================================================
   Tokens. Light is the base; dark redefines only the values.
   ============================================================ */
:root{
  --ground:#EDF0F0;
  --surface:#FFFFFF;
  --sunk:#E2E7E7;
  --ink:#0E1517;
  --muted:#59696C;
  --water:#0A5A5E;
  --water-lift:#0E7C7B;
  --dim:#B8501C;
  --line:#CFD8D7;
  --line-soft:#E1E7E6;
  --hero-ground:#08191B;
  --hero-ink:#EAF1F0;
  --hero-muted:#8CA5A4;
  --draw:#2B3A3C;
  --draw-ghost:#A9B8B8;
  --shadow:0 1px 2px rgba(14,21,23,.06), 0 12px 28px -18px rgba(14,21,23,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1113;
    --surface:#131B1D;
    --sunk:#0F1719;
    --ink:#E9EEED;
    --muted:#93A3A5;
    --water:#45B3B0;
    --water-lift:#63C9C4;
    --dim:#E8834A;
    --line:#233030;
    --line-soft:#1B2526;
    --hero-ground:#070F11;
    --hero-ink:#EAF1F0;
    --hero-muted:#8CA5A4;
    --draw:#C6D4D4;
    --draw-ghost:#46595A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1113;
  --surface:#131B1D;
  --sunk:#0F1719;
  --ink:#E9EEED;
  --muted:#93A3A5;
  --water:#45B3B0;
  --water-lift:#63C9C4;
  --dim:#E8834A;
  --line:#233030;
  --line-soft:#1B2526;
  --hero-ground:#070F11;
  --hero-ink:#EAF1F0;
  --hero-muted:#8CA5A4;
  --draw:#C6D4D4;
  --draw-ghost:#46595A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-weight:700;
  letter-spacing:-.022em;
  line-height:1.06;
  text-wrap:balance;
  margin:0;
}
.mono,.spec,.dimtxt,.eyebrow,.chip,.btn,input,select,textarea,th,td.num{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
}
a{color:inherit}
p{margin:0 0 1em}
img{max-width:100%}

/* ---------- shared bits ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:10px;margin:0 0 18px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.lede{font-size:21px;line-height:1.55;color:var(--muted);max-width:62ch;font-weight:300}
.prose{max-width:66ch}
.prose p{margin-bottom:1.15em}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:13px 20px;border:1px solid var(--water);border-radius:2px;
  background:var(--water);color:var(--surface);text-decoration:none;cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn:hover{background:var(--water-lift);border-color:var(--water-lift)}
.btn.ghost{background:transparent;color:var(--water);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--water);background:transparent;color:var(--water-lift)}
.btn.on-dark{background:transparent;border-color:rgba(234,241,240,.32);color:var(--hero-ink)}
.btn.on-dark:hover{border-color:var(--hero-ink);background:rgba(234,241,240,.06)}
.btn.on-dark.solid{background:var(--hero-ink);color:var(--hero-ground);border-color:var(--hero-ink)}
.btn.on-dark.solid:hover{background:#fff;border-color:#fff}

:focus-visible{outline:2px solid var(--dim);outline-offset:3px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:28px;height:70px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;line-height:1;flex-shrink:0}
.brand-tx{display:flex;flex-direction:column;line-height:1}
.logo-mark{width:42px;height:35px;flex-shrink:0;display:block}
.brand b{font-family:"Archivo";font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand span{
  font-family:"IBM Plex Mono";font-size:9.5px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--water);margin-top:5px;
}
nav{display:flex;gap:26px;margin-left:auto;align-items:center}
nav a{
  font-family:"Archivo";font-size:13.5px;font-weight:500;letter-spacing:-.005em;
  text-decoration:none;color:var(--ink);padding:6px 0;border-bottom:2px solid transparent;
  transition:border-color .16s ease,color .16s ease;white-space:nowrap;
}
nav a:hover{color:var(--water)}
nav a[aria-current="page"]{border-bottom-color:var(--water);color:var(--water)}
.utils{display:flex;align-items:center;gap:16px;flex-shrink:0}
.tel{
  font-family:"IBM Plex Mono";font-size:12px;font-weight:500;color:var(--muted);
  text-decoration:none;white-space:nowrap;
}
.tel:hover{color:var(--water)}
.lang{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.lang button{
  font-family:"IBM Plex Mono";font-size:11px;font-weight:600;letter-spacing:.06em;
  padding:6px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--water);color:var(--surface)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:2px;
  padding:8px 10px;cursor:pointer;color:var(--ink)}

/* ---------- hero ---------- */
.hero{background:var(--hero-ground);color:var(--hero-ink);overflow:hidden;position:relative}
.hero .wrap{
  display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);
  gap:52px;align-items:center;padding-top:72px;padding-bottom:72px;
}
.hero h1{font-size:clamp(38px,5.1vw,63px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--water-lift);display:block}
.hero p{color:var(--hero-muted);font-size:19px;font-weight:300;max-width:44ch;margin-top:22px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-eyebrow{color:var(--hero-muted)}
.hero-eyebrow::after{background:rgba(234,241,240,.18)}

/* photographic hero: the material carries the feeling, type sits over it */
.hero.shot{min-height:min(84vh,760px);display:flex;align-items:flex-end}
.hero.shot .wrap{
  grid-template-columns:1fr;position:relative;z-index:2;
  padding-top:120px;padding-bottom:78px;
}
.hero-photo{position:absolute;inset:0;z-index:0}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:1}
.hero-photo::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(100deg,rgba(8,25,27,.94) 4%,rgba(8,25,27,.74) 38%,rgba(8,25,27,.12) 82%),
    linear-gradient(0deg,rgba(8,25,27,.8) 0%,rgba(8,25,27,0) 52%);
}
.hero.shot h1{font-size:clamp(40px,6vw,78px);letter-spacing:-.04em;max-width:15ch}
.hero.shot h1 em{color:var(--water-lift);opacity:1}
.hero.shot p{font-size:clamp(17px,1.5vw,21px);max-width:48ch}

/* full-bleed image band used to break the page and carry a single claim */
.band{position:relative;background:var(--hero-ground);color:var(--hero-ink);overflow:hidden}
.band img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;
}
.band::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--hero-ground) 4%,rgba(8,25,27,.72) 46%,rgba(8,25,27,.1) 92%);
}
.band .wrap{position:relative;z-index:2;padding:96px 28px}
.band h2{font-size:clamp(28px,3.6vw,46px);max-width:17ch;letter-spacing:-.03em}
.band p{color:var(--hero-muted);font-size:19px;font-weight:300;max-width:46ch;margin-top:18px}

/* a framed still, used beside prose */
.still{position:relative;border-radius:3px;overflow:hidden;background:var(--hero-ground)}
.still img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.still figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:16px 18px;
  font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#EAF1F0;background:linear-gradient(0deg,rgba(8,25,27,.86),rgba(8,25,27,0));
}

/* closing call to action - on every page */
.cta-band{position:relative;background:var(--hero-ground);color:var(--hero-ink);overflow:hidden}
.cta-band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.cta-band::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--hero-ground) 10%,rgba(8,25,27,.78) 60%,rgba(8,25,27,.34) 100%);
}
.cta-band .wrap{
  position:relative;z-index:2;padding:74px 28px;display:grid;
  grid-template-columns:minmax(0,1.15fr) auto;gap:40px;align-items:center;
}
.cta-band h2{font-size:clamp(26px,3.2vw,40px);max-width:18ch;letter-spacing:-.03em}
.cta-band p{color:var(--hero-muted);font-size:18px;font-weight:300;max-width:48ch;margin-top:14px}
.cta-actions{display:flex;gap:12px;flex-wrap:wrap}

.facts{
  border-top:1px solid rgba(234,241,240,.14);background:var(--hero-ground);
  color:var(--hero-ink);
}
.facts .wrap{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding-top:0;padding-bottom:0;
}
.fact{padding:26px 26px 26px 0;border-right:1px solid rgba(234,241,240,.14)}
.fact:last-child{border-right:0}
.fact b{
  display:block;font-family:"IBM Plex Mono";font-size:24px;font-weight:500;
  letter-spacing:-.02em;color:var(--hero-ink);
}
.fact span{
  display:block;margin-top:6px;font-family:"Archivo";font-size:12.5px;
  color:var(--hero-muted);line-height:1.4;
}

/* ---------- sections ---------- */
section{padding:76px 0}
section.tight{padding:52px 0}
.alt{background:var(--surface);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
h2.sec{font-size:clamp(27px,3.1vw,38px);font-weight:700;margin-bottom:14px}
h3.sub{font-size:19px;font-weight:600;letter-spacing:-.015em}

/* ---------- the finder ---------- */
.finder{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);overflow:hidden;
}
.finder-head{
  padding:22px 26px;border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
}
.finder-head h3{font-size:20px;font-weight:700;font-family:"Archivo";letter-spacing:-.02em;margin:0}
.finder-head p{margin:6px 0 0;font-size:15px;color:var(--muted);font-weight:300}
.finder-body{padding:24px 26px}
.inputs{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px}
.field label{
  font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.field input,.field select{
  font-size:15px;padding:11px 13px;width:118px;background:var(--ground);
  border:1px solid var(--line);border-radius:2px;color:var(--ink);
}
.field select{width:auto;min-width:170px}
.times{font-family:"IBM Plex Mono";color:var(--muted);padding-bottom:12px;font-size:15px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.presets span{
  font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-right:2px;
}
.chip{
  font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:2px;
  background:transparent;color:var(--ink);cursor:pointer;transition:all .16s ease;
}
.chip:hover{border-color:var(--water);color:var(--water)}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--surface)}
.results{border-top:1px solid var(--line-soft);background:var(--sunk)}
.results-head{
  padding:14px 26px;font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.results-head b{color:var(--dim);font-weight:600}

/* ---------- product grid ---------- */
.grid{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
/* auto-fit so a partial last row stretches instead of leaving an empty cell */
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(296px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.card{
  background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px;
  text-decoration:none;color:inherit;transition:background .16s ease;position:relative;
}
.card:hover{background:var(--ground)}
.card:hover .card-go{color:var(--water);transform:translateX(3px)}
.card-cat{
  font-family:"IBM Plex Mono";font-size:9.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--water);
}
.card h4{font-family:"Archivo";font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.card-draw{background:var(--ground);border-radius:2px;padding:6px;min-height:118px;
  display:flex;align-items:center;justify-content:center}
.card:hover .card-draw{background:var(--sunk)}
/* product card: photograph, with the scale plan taking over on hover */
.card-media{position:relative;border-radius:2px;overflow:hidden;background:var(--sunk)}
.card-media img{
  width:100%;display:block;aspect-ratio:3/2;object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.7,.3,1),opacity .28s ease;
}
.card-plan{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:8px;background:var(--ground);opacity:0;transition:opacity .28s ease;
  pointer-events:none;
}
/* no image for this SKU - show the plan outright */
.card-media:not(:has(img)) .card-plan{opacity:1;position:static;min-height:118px}
@media (hover:hover){
  .card:hover .card-media img{transform:scale(1.04)}
  .card:hover .card-plan{opacity:1}
}
.card-photo{border-radius:2px;overflow:hidden;background:var(--sunk)}
.card-photo img{
  width:100%;display:block;aspect-ratio:3/2;object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.7,.3,1);
}
.card:hover .card-photo img{transform:scale(1.04)}
.card-meta{
  margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  font-family:"IBM Plex Mono";font-size:11.5px;color:var(--muted);
}
.card-meta b{color:var(--dim);font-weight:600;letter-spacing:-.01em}
.card-go{transition:transform .16s ease,color .16s ease;font-size:14px}

/* ---------- catalogue layout ---------- */
.cat-layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:36px;align-items:start}
.rail{position:sticky;top:94px;display:flex;flex-direction:column;gap:26px}
.rail-block h4{
  font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 12px;
}
.rail-list{display:flex;flex-direction:column;gap:2px}
.rail-list button{
  text-align:left;background:none;border:0;padding:7px 10px;border-radius:2px;cursor:pointer;
  font-family:"Archivo";font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;
  gap:10px;transition:background .14s ease,color .14s ease;
}
.rail-list button:hover{background:var(--surface)}
.rail-list button[aria-pressed="true"]{background:var(--water);color:var(--surface)}
.rail-list button i{font-family:"IBM Plex Mono";font-style:normal;font-size:11px;opacity:.62}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:start}
.detail-draw{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:26px;
  box-shadow:var(--shadow);
}
table.spec{width:100%;border-collapse:collapse;font-size:13.5px;margin:18px 0 0}
table.spec th,table.spec td{
  text-align:left;padding:11px 2px;border-bottom:1px solid var(--line-soft);vertical-align:top;
}
table.spec th{font-weight:500;color:var(--muted);width:52%;letter-spacing:-.01em}
table.spec td{font-weight:500}
.heights{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.height-chip{
  font-family:"IBM Plex Mono";font-size:12px;padding:7px 11px;border:1px solid var(--line);
  border-radius:2px;color:var(--ink);background:var(--surface);
}

/* material gallery: a horizontal reel, scrollable, snapping */
.reel{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,31%);
  gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.reel figure{margin:0;scroll-snap-align:start;position:relative;overflow:hidden;border-radius:3px}
.reel img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;background:var(--sunk)}
.reel figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:14px 16px;
  font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#EAF1F0;background:linear-gradient(0deg,rgba(8,25,27,.8),rgba(8,25,27,0));
}
.reel::-webkit-scrollbar{height:6px}
.reel::-webkit-scrollbar-track{background:transparent}
.reel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.reel-hint{
  font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;
}

/* ---------- steps / timeline ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft)}
.step{background:var(--surface);padding:26px 22px}
.step-n{
  font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--dim);
  letter-spacing:.1em;margin-bottom:14px;
}
.step h4{font-family:"Archivo";font-size:16px;font-weight:600;margin:0 0 8px;letter-spacing:-.015em}
.step p{font-size:15px;color:var(--muted);font-weight:300;margin:0}

.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:12px}
.tl{border-top:2px solid var(--water);padding-top:18px}
.tl b{font-family:"IBM Plex Mono";font-size:26px;font-weight:500;display:block;letter-spacing:-.02em}
.tl p{font-size:15.5px;color:var(--muted);margin:8px 0 0;font-weight:300}

.split{display:grid;grid-template-columns:repeat(2,1fr);gap:52px;align-items:start}
.callout{
  border-left:2px solid var(--dim);padding:4px 0 4px 20px;margin:26px 0;
  font-size:18px;line-height:1.5;font-weight:300;
}
.callout b{font-weight:500;color:var(--ink)}

/* ---------- contact / form ---------- */
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.formgrid .full{grid-column:1/-1}
.formgrid label{
  font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;
}
.formgrid input,.formgrid select,.formgrid textarea{
  width:100%;font-size:15px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:2px;color:var(--ink);
  font-family:"IBM Plex Mono";
}
.formgrid textarea{min-height:104px;resize:vertical;line-height:1.55}
.composed{
  margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:18px;font-family:"IBM Plex Mono";font-size:13px;white-space:pre-wrap;line-height:1.62;
}
.addr{font-family:"IBM Plex Mono";font-size:14px;line-height:2;color:var(--muted)}
.addr b{color:var(--ink);font-weight:500}
.addr a{color:var(--water);text-decoration:none}
.addr a:hover{text-decoration:underline}

/* ---------- footer ---------- */
footer{background:var(--hero-ground);color:var(--hero-muted);padding:56px 0 30px;margin-top:0}
.foot{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:36px}
footer h5{
  font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--hero-ink);margin:0 0 14px;
}
footer a{color:var(--hero-muted);text-decoration:none;font-family:"Archivo";font-size:13.5px;
  display:block;padding:4px 0}
footer a:hover{color:var(--hero-ink)}
.foot-brand b{font-family:"Archivo";font-weight:800;font-size:18px;color:var(--hero-ink);
  letter-spacing:-.03em;display:block}
.foot-brand span{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--water-lift);display:block;margin-top:5px}
.foot-brand p{font-family:"IBM Plex Mono";font-size:12.5px;line-height:1.95;margin:18px 0 0}
.legal{
  margin-top:44px;padding-top:20px;border-top:1px solid rgba(234,241,240,.14);
  font-family:"IBM Plex Mono";font-size:11.5px;display:flex;justify-content:space-between;
  gap:18px;flex-wrap:wrap;
}
.made{display:inline-flex;align-items:center;gap:7px}
.made i{width:15px;height:10px;display:inline-block;border-radius:1px;
  background:linear-gradient(90deg,#0F8A4C 0 33.3%,#F2F2F2 33.3% 66.6%,#C5322E 66.6% 100%)}

/* ---------- drawing primitives ---------- */
.dimline{stroke:var(--dim);stroke-width:1}
.dimtxt{fill:var(--dim);font-size:11px;font-weight:500}
.outline{fill:none;stroke:var(--draw);stroke-width:1.6}
.ghost{fill:none;stroke:var(--draw-ghost);stroke-width:1.3;stroke-dasharray:5 4}
.fillsoft{fill:var(--sunk)}
.hatch{stroke:var(--draw-ghost);stroke-width:.7}

/* ---------- hero drawing animation ---------- */
#shell{animation:drop 1.5s cubic-bezier(.22,.7,.28,1) .35s both}
@keyframes drop{from{transform:translateY(-58px);opacity:0}to{transform:translateY(0);opacity:1}}
.anno{animation:fadein .7s ease 1.7s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #shell,.anno{animation:none}
  *{transition:none !important}
}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero .wrap{grid-template-columns:1fr;gap:38px;padding-top:52px;padding-bottom:52px}
  .facts .wrap{grid-template-columns:repeat(2,1fr)}
  .fact:nth-child(2){border-right:0}
  .fact{border-bottom:1px solid rgba(234,241,240,.14)}
  .grid.g4{grid-template-columns:repeat(3,1fr)}
  .cat-layout{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;flex-wrap:wrap;gap:20px}
  .rail-block{flex:1;min-width:200px}
  .detail{grid-template-columns:1fr;gap:30px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr;gap:34px}
  .foot{grid-template-columns:repeat(2,1fr)}
  .cta-band .wrap{grid-template-columns:1fr;gap:26px;padding:56px 28px}
  .hero.shot .wrap{padding-top:96px;padding-bottom:56px}
  .band .wrap{padding:68px 28px}
  .band::after,.cta-band::after{
    background:linear-gradient(0deg,var(--hero-ground) 14%,rgba(8,25,27,.72) 70%,rgba(8,25,27,.35) 100%);
  }
}
@media (max-width:720px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  section{padding:52px 0}
  nav{display:none}
  nav.open{
    display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;
    background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;gap:4px;
  }
  nav.open a{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
  /* nav is hidden here, so .utils takes over pushing the row right */
  .bar{gap:12px}
  .utils{margin-left:auto}
  .menu-btn{display:block;order:3}
  .utils .tel{display:none}
  .grid.g3,.grid.g4{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr;gap:22px}
  .formgrid{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr;gap:26px}
  .facts .wrap{grid-template-columns:1fr}
  .fact{border-right:0;padding-right:0}
  .hero h1{font-size:clamp(31px,8vw,42px)}
}
@media (max-width:460px){
  .grid.g3,.grid.g4{grid-template-columns:1fr}
}

   4. Drawing. Every product is drawn to scale from its own
      dimensions - no photography anywhere on the site.
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (n % 1 === 0 ? n.toFixed(0) : String(n).replace(".", ","));

/** A dimension line: thin rule, tick ends, mono numeral. Only ever
 *  drawn against a real measurement. */
function dimH(x1,x2,y,label){
  // the rule breaks around the numeral, as on a drafted dimension
  const mid = (x1+x2)/2;
  const gap = Math.min((x2-x1) - 14, label.length*6.3 + 10);
  const a = mid - gap/2, b = mid + gap/2;
  return `<g class="anno">
    <line class="dimline" x1="${x1}" y1="${y}" x2="${a}" y2="${y}"/>
    <line class="dimline" x1="${b}" y1="${y}" x2="${x2}" y2="${y}"/>
    <line class="dimline" x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}"/>
    <line class="dimline" x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}"/>
    <text class="dimtxt" x="${mid}" y="${y+4}" text-anchor="middle">${label}</text>
  </g>`;
}
function dimV(y1,y2,x,label){
  return `<g class="anno">
    <line class="dimline" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>
    <line class="dimline" x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}"/>
    <line class="dimline" x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}"/>
    <text class="dimtxt" x="${x+8}" y="${(y1+y2)/2+4}">${label}</text>
  </g>`;
}

/**
 * Plan view of one product, drawn to scale.
 * Reads the product name for real features - seat, shelf, lowered
 * edge, corner - so two SKUs of the same footprint don't draw alike.
 */
function planSVG(p, size, opts){
  opts = opts || {};
  const big = !!opts.big;
  const W = big ? 640 : 260;
  const pad = big ? 54 : 26;
  if(!size){ // no dimensions published for this SKU
    return `<svg viewBox="0 0 ${W} ${big?300:130}" width="100%" role="img" aria-hidden="true">
      <rect x="${pad}" y="${big?70:26}" width="${W-pad*2}" height="${big?150:70}" rx="6" class="ghost"/>
    </svg>`;
  }
  const [L,Wd] = size;
  const name = (p.it + " " + p.en).toLowerCase();
  const corner = /angolare|corner/.test(name) || Math.abs(L-Wd) < 6;
  const seat   = /sedile|seat/.test(name);
  const shelf  = /piano|shelf/.test(name);
  const lower  = /ribasso|lowered/.test(name);
  const overlay= p.cat === "sovrapposizione";

  const avail = W - pad*2;
  const maxH  = big ? 250 : 96;
  const scale = Math.min(avail / L, maxH / Wd);
  const w = L*scale, h = Wd*scale;
  const x = (W - w)/2, y = big ? 46 : 18;
  const H = y + h + (big ? 54 : 30);
  const r = corner ? 4 : Math.min(10, h*0.16);

  let g = "";
  // the bath being replaced, ghosted, for the overlay family
  if(overlay){
    const o = big ? 11 : 5;
    g += `<rect x="${x-o}" y="${y-o}" width="${w+o*2}" height="${h+o*2}" rx="${r+o/1.5}" class="ghost"/>`;
  }
  g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="outline fillsoft"/>`;
  // inner line = the internal basin wall
  const i = big ? 9 : 4;
  g += `<rect x="${x+i}" y="${y+i}" width="${w-i*2}" height="${h-i*2}" rx="${Math.max(2,r-i/2)}" class="outline" opacity=".45"/>`;

  if(corner){ // quadrant sweep across the front corner
    g += `<path d="M ${x+i} ${y+h-i} A ${w-i*2} ${h-i*2} 0 0 0 ${x+w-i} ${y+i}" class="outline" opacity=".35" fill="none"/>`;
  }
  if(seat){
    const sw = Math.min(w*0.3, h*1.05);
    g += `<rect x="${x+w-i-sw}" y="${y+i}" width="${sw}" height="${h-i*2}" rx="3" class="outline" opacity=".7"/>`;
    if(big) g += `<text class="dimtxt" x="${x+w-i-sw/2}" y="${y+h/2+4}" text-anchor="middle" opacity=".85">${LANG==="it"?"sedile":"seat"}</text>`;
  }
  if(shelf){
    const sw = Math.min(w*0.24, 90*scale);
    g += `<rect x="${x+i}" y="${y+i}" width="${sw}" height="${h-i*2}" rx="3" class="outline" opacity=".7"/>`;
    g += `<line x1="${x+i+sw}" y1="${y+i}" x2="${x+i+sw}" y2="${y+h-i}" class="hatch"/>`;
  }
  if(lower){
    const sw = Math.min(w*0.32, 60*scale);
    g += `<rect x="${x+w-i-sw}" y="${y+i}" width="${sw}" height="${h-i*2}" rx="3" class="ghost"/>`;
  }
  // waste
  const dx = seat ? x + w*0.3 : x + w*0.5, dy = y + h*0.5;
  g += `<circle cx="${dx}" cy="${dy}" r="${big?9:4.5}" class="outline" opacity=".6"/>`;
  g += `<circle cx="${dx}" cy="${dy}" r="${big?3:1.6}" fill="var(--draw)" opacity=".5"/>`;

  // dimensions
  g += dimH(x, x+w, y+h+(big?30:18), num(L) + " cm");
  if(big) g += dimV(y, y+h, x+w+22, num(Wd) + " cm");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="${esc(p[LANG])} \u2014 ${num(L)} \u00d7 ${num(Wd)} cm">${g}</svg>`;
}

/* ============================================================
   5. Catalogue helpers
   ============================================================ */
const CATS = DATA.categories;
const PRODUCTS = DATA.products;
const catName = id => { const c = CATS.find(c=>c.id===id); return c ? c[LANG] : id; };
const firstSize = p => p.sizes && p.sizes.length ? p.sizes[0] : null;
const sizeLabel = p => {
  if(!p.sizes.length) return "\u2014";
  const s = p.sizes[0];
  return num(s[0]) + " \u00d7 " + num(s[1]) + (p.sizes.length>1 ? " +" + (p.sizes.length-1) : "");
};
// common Italian bath and tray footprints, taken from the catalogue itself
const PRESETS = [[170,70],[160,70],[150,70],[140,70],[122,72],[172,72],[172,82],[107,72],[80,80]];

function matches(L,W,tol){
  return PRODUCTS
    .map(p=>{
      let best=null;
      (p.sizes||[]).forEach(s=>{
        const d = Math.abs(s[0]-L) + Math.abs(s[1]-W);
        if(Math.abs(s[0]-L)<=tol && Math.abs(s[1]-W)<=tol && (!best || d<best.d)) best={s,d};
      });
      return best ? {p, size:best.s, d:best.d} : null;
    })
    .filter(Boolean)
    .sort((a,b)=>a.d-b.d);
}

function card(p, size){
  const s = size || firstSize(p);
  return `<a class="card" href="#/p/${p.id}" data-nav>

    <h4>${esc(p[LANG])}</h4>

  </a>`;
}

/* ============================================================
   7. Router
   ============================================================ */
const ROUTES = [
  ["#/",            "home",     () => viewHome()],
  ["#/sistema",     "sistema",  () => viewSistema()],
  ["#/prodotti",    "prodotti", q => viewProducts(q)],
  ["#/azienda",     "azienda",  () => viewAzienda()],
  ["#/termoformatura","termo",  () => viewTermo()],
  ["#/contatti",    "contatti", q => viewContatti(q)]
];

function parseHash(){
  const raw = location.hash || "#/";
  const [path, qs] = raw.split("?");
  return {path, query:new URLSearchParams(qs || "")};
}

function render(){
  const {path, query} = parseHash();
  const T_ = t();
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-lang]").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));

  // nav
  const key = path.startsWith("#/p/") ? "prodotti" : (ROUTES.find(r=>r[0]===path)||ROUTES[0])[1];
  document.getElementById("nav").innerHTML = [
    ["#/sistema","sistema"],["#/prodotti","prodotti"],
    ["#/termoformatura","termo"],["#/azienda","azienda"],["#/contatti","contatti"]
  ].map(([h,k])=>`<a href="${h}" data-nav ${k===key?'aria-current="page"':""}>${esc(T_.nav[k])}</a>`).join("");

  // page
  const app = document.getElementById("app");
  if(path.startsWith("#/p/")) app.innerHTML = viewDetail(path.slice(4));
  else {
    const r = ROUTES.find(r=>r[0]===path) || ROUTES[0];
    app.innerHTML = r[2](query);
  }
  // the contact page IS the call to action, so it does not repeat it
  if(path !== "#/contatti") app.insertAdjacentHTML("beforeend", ctaBand());

  // footer
  document.getElementById("foot").innerHTML = `
    <div class="foot">
      <div class="foot-brand">
        <b>bardelli mario</b><span>Acrylic System<sup>&reg;</sup></span>
        <p>Via Lago, 135<br>21023 Besozzo (VA), Italia<br>
        +39 0332 989110<br>info@bardellimario.eu</p>
      </div>
      <div><h5>${esc(T_.catsKicker)}</h5>
        ${CATS.map(c=>`<a href="#/prodotti?cat=${c.id}" data-nav>${esc(c[LANG])}</a>`).join("")}</div>
      <div><h5>${esc(T_.aziKicker)}</h5>
        <a href="#/sistema" data-nav>${esc(T_.nav.sistema)}</a>
        <a href="#/azienda" data-nav>${esc(T_.nav.azienda)}</a>
        <a href="#/termoformatura" data-nav>${esc(T_.nav.termo)}</a>
        <a href="#/contatti" data-nav>${esc(T_.nav.contatti)}</a></div>
      <div><h5>${esc(T_.langNote)}</h5>
        <a href="#" data-setlang="it">Italiano</a>
        <a href="#" data-setlang="en">English</a></div>
    </div>
    <div class="legal">
      <span>&copy; ${new Date().getFullYear()} Bardelli Mario &middot; P.IVA IT 02555390125</span>
      <span class="made"><i></i> ${LANG==="it"?"Qualit\u00e0 Made in Italy":"Quality Made in Italy"}</span>
    </div>`;

  if(document.getElementById("fGrid")) runFinder();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---- events ---- */
addEventListener("hashchange", render);
addEventListener("DOMContentLoaded", render);

document.addEventListener("click", e=>{
  const lang = e.target.closest("[data-lang]");
  if(lang){ setLang(lang.dataset.lang); return; }

  const setl = e.target.closest("[data-setlang]");
  if(setl){ e.preventDefault(); setLang(setl.dataset.setlang); return; }

  const preset = e.target.closest("[data-preset]");
  if(preset){
    const [L,W] = preset.dataset.preset.split(",");
    document.getElementById("fL").value = L;
    document.getElementById("fW").value = W;
    runFinder();
    return;
  }

  const filter = e.target.closest("[data-f]");
  if(filter){
    const {query} = parseHash();
    if(filter.dataset.v) query.set(filter.dataset.f, filter.dataset.v);
    else query.delete(filter.dataset.f);
    const qs = query.toString();
    location.hash = "#/prodotti" + (qs ? "?"+qs : "");
    return;
  }

  const menu = e.target.closest("#menuBtn");
  if(menu){
    const nav = document.getElementById("nav");
    const open = nav.classList.toggle("open");
    menu.setAttribute("aria-expanded", open ? "true" : "false");
    return;
  }
  if(e.target.closest("nav a")) {
    document.getElementById("nav").classList.remove("open");
    document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  }
});

document.addEventListener("input", e=>{
  if(["fL","fW","fT"].includes(e.target.id)) runFinder();
});
document.addEventListener("change", e=>{
  if(e.target.id === "fT") runFinder();
});

/* Enquiry: compose the text and hand it over. Nothing is sent from
   the page - the visitor copies it or opens it in their mail client. */
document.addEventListener("submit", e=>{
  if(e.target.id !== "enq") return;
  e.preventDefault();
  const f = e.target, T_ = t();
  const v = n => (f.elements[n].value || "").trim();
  // only the fields actually filled in
  const rows = [[T_.fType,"t"],[T_.fName,"n"],[T_.fEmail,"e"],[T_.fPhone,"p"],
                [T_.fCity,"c"],[T_.fSize,"s"]]
    .filter(([,k]) => v(k))
    .map(([label,k]) => `${label}: ${v(k)}`);
  const lines = (v("m") ? rows.concat(["", v("m")]) : rows).join("\n");
  const subj = (LANG==="it" ? "Richiesta \u2014 " : "Enquiry \u2014 ") + (v("t") || "Bardelli Mario");
  const box = document.getElementById("composed");
  box.innerHTML = `
    <p style="font-size:15px;color:var(--muted);margin-top:22px;font-weight:300">${esc(T_.fComposeHint)}</p>
    <div class="composed" id="enqText">${esc(lines)}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn ghost" type="button" id="copyBtn">${esc(T_.fCopy)}</button>
      <a class="btn ghost" href="mailto:info@bardellimario.eu?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(lines)}">${esc(T_.fOpenMail)}</a>
    </div>`;
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
});

document.addEventListener("click", e=>{
  if(!e.target.closest("#copyBtn")) return;
  const btn = e.target.closest("#copyBtn");
  const txt = document.getElementById("enqText").textContent;
  const done = () => { btn.textContent = t().fCopied; setTimeout(()=>btn.textContent = t().fCopy, 1800); };
  try{
    navigator.clipboard.writeText(txt).then(done, () => selectFallback());
  }catch(err){ selectFallback(); }
  function selectFallback(){
    const r = document.createRange();
    r.selectNodeContents(document.getElementById("enqText"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
});

render();
</script>
